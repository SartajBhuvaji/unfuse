<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Where the bytes are in Gemma 4 31B NVFP4, before and after. Three proportion bars drawn to a common scale of 27.6 pixels per gigabyte. First, NVIDIA's build at 32.63 gigabytes, split into NVFP4 MLPs at 11.70, bfloat16 attention at 15.85, tied embeddings at 2.82 and the vision tower at 1.15. Second, after removing the vision tower, 31.48 gigabytes. Third, after quantizing attention to FP8, 23.00 gigabytes, recovering 9.63 gigabytes. A footer compares removable vision share as a percentage of parameters: Gemma 4 31B at 1.88 percent with a real SigLIP tower, against Gemma 4 12B at 0.438 percent, which has no encoder at all.">
  <defs>
    <style>
      .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #14181E; }
      .sub { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #838C99; }
      .n { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #59616D; }
      .cap { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #838C99; }
      .keeplab { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #12586F; }
      .cutlab { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #B45A22; }
      .nvfp4 { fill: #E7E4F2; stroke: #5B4B9E; stroke-width: 1.25; }
      .bf16  { fill: #DCEAF0; stroke: #12586F; stroke-width: 1.25; }
      .fp8   { fill: #DFEEE4; stroke: #2E7D5B; stroke-width: 1.25; }
      .emb   { fill: #EEF2F5; stroke: #838C99; stroke-width: 1.25; }
      .cut   { fill: #F6E4D6; stroke: #B45A22; stroke-width: 1.25; }
      .rule  { stroke: #E4E8EC; stroke-width: 1; }
      .tick  { stroke: #B9C1CB; stroke-width: 1; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/>

  <text class="t" x="40" y="34">Where the bytes are</text>
  <text class="sub" x="40" y="50">nvidia/Gemma-4-31B-IT-NVFP4 · scale: 1 GB = 27.6 px · widths are measured file sizes</text>

  <!-- legend -->
  <g transform="translate(40,66)">
    <rect class="nvfp4" x="0"   y="0" width="11" height="11" rx="2"/><text class="n" x="17"  y="10">NVFP4 (NVIDIA)</text>
    <rect class="bf16"  x="130" y="0" width="11" height="11" rx="2"/><text class="n" x="147" y="10">BF16</text>
    <rect class="fp8"   x="205" y="0" width="11" height="11" rx="2"/><text class="n" x="222" y="10">FP8 (ours)</text>
    <rect class="emb"   x="300" y="0" width="11" height="11" rx="2"/><text class="n" x="317" y="10">tied embeddings</text>
    <rect class="cut"   x="430" y="0" width="11" height="11" rx="2"/><text class="n" x="447" y="10">removed</text>
  </g>

  <!-- bar 1: as shipped by NVIDIA. 32.63 GB -> 901px at 27.6 px/GB -->
  <text class="t"   x="40" y="120">as shipped</text>
  <text class="sub" x="40" y="135">32.63 GB · 1,728 tensors</text>
  <rect class="nvfp4" x="40"    y="146" width="323" height="34"/>
  <rect class="bf16"  x="363"   y="146" width="437" height="34"/>
  <rect class="emb"   x="800"   y="146" width="78"  height="34"/>
  <rect class="cut"   x="878"   y="146" width="32"  height="34"/>
  <text class="n" x="201" y="167" text-anchor="middle">MLPs · 11.70</text>
  <text class="n" x="581" y="167" text-anchor="middle">attention · 15.85 GB · untouched by NVIDIA</text>
  <text class="n" x="839" y="167" text-anchor="middle">2.82</text>
  <text class="cutlab" x="920" y="167">1.15</text>

  <!-- bar 2: vision removed -->
  <text class="t"   x="40" y="222">− vision tower</text>
  <text class="sub" x="40" y="237">31.48 GB · 356 tensors deleted · 3.5% smaller</text>
  <rect class="nvfp4" x="40"  y="248" width="323" height="34"/>
  <rect class="bf16"  x="363" y="248" width="437" height="34"/>
  <rect class="emb"   x="800" y="248" width="78"  height="34"/>
  <line class="tick" x1="878" y1="242" x2="878" y2="288"/>
  <text class="n" x="201" y="269" text-anchor="middle">MLPs · 11.70</text>
  <text class="n" x="581" y="269" text-anchor="middle">attention · 15.85 GB</text>
  <text class="n" x="839" y="269" text-anchor="middle">2.82</text>

  <!-- bar 3: fp8 attention. attention halves 437 -> 219 -->
  <text class="t"   x="40" y="324">− FP8 attention</text>
  <text class="sub" x="40" y="339">23.00 GB · 230 projections requantized · 29.5% smaller</text>
  <rect class="nvfp4" x="40"  y="350" width="323" height="34"/>
  <rect class="fp8"   x="363" y="350" width="219" height="34"/>
  <rect class="emb"   x="582" y="350" width="78"  height="34"/>
  <line class="tick" x1="878" y1="344" x2="878" y2="390"/>
  <text class="n" x="201" y="371" text-anchor="middle">MLPs · 11.70</text>
  <text class="n" x="472" y="371" text-anchor="middle">7.93</text>
  <text class="n" x="621" y="371" text-anchor="middle">2.82</text>
  <text class="keeplab" x="672" y="371">← 9.63 GB recovered</text>

  <!-- footer: the removable share, 31B vs 12B -->
  <line class="rule" x1="40" y1="412" x2="1040" y2="412"/>
  <text class="sub" x="40" y="434">removable vision share, as % of parameters — check model_type before assuming a model is worth splitting</text>
  <text class="n" x="40" y="454">Gemma 4 31B</text>
  <rect class="bf16" x="150" y="444" width="240" height="12"/>
  <rect class="cut"  x="390" y="444" width="5"   height="12"/>
  <text class="cutlab" x="402" y="454">1.88%  real SigLIP tower</text>
  <text class="n" x="600" y="454">Gemma 4 12B</text>
  <rect class="bf16" x="710" y="444" width="247" height="12"/>
  <rect class="cut"  x="957" y="444" width="1"   height="12"/>
  <text class="cutlab" x="966" y="454">0.438%  no encoder at all</text>
</svg>
