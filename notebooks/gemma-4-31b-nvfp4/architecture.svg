<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Gemma 4 31B NVFP4 forward path. An upper vision branch runs image, patch embedder, 27 SigLIP blocks and a vision projection, all enclosed in a dashed delete boundary labelled model.vision_tower and model.embed_vision, 575,743,536 parameters, 1.15 gigabytes. Its only output is a single arrow of image soft tokens descending into a scatter fusion point on the lower text spine. The text spine runs text tokens, tied embed tokens, fusion, 60 decoder layers, norm and a tied lm head, to logits. Inside each decoder layer the self attention projections are requantized from bfloat16 to FP8 while the MLPs stay in NVIDIA's NVFP4. The result is 23.00 gigabytes, down from 32.63.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#838C99"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45A22"/>
    </marker>
    <style>
      .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #14181E; }
      .s { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #59616D; }
      .n { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #838C99; }
      .lab { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #59616D; }
      .cutlab { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #B45A22; letter-spacing: .06em; }
      .keeplab { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #12586F; letter-spacing: .06em; }
      .box { fill: #FFFFFF; stroke: #B9C1CB; stroke-width: 1.5; }
      .keep { fill: #DCEAF0; stroke: #12586F; stroke-width: 1.5; }
      .cut { fill: #F6E4D6; stroke: #B45A22; stroke-width: 1.5; }
      .fp8 { fill: #DFEEE4; stroke: #2E7D5B; stroke-width: 1.5; }
      .nvfp4 { fill: #E7E4F2; stroke: #5B4B9E; stroke-width: 1.5; }
      .io { fill: none; stroke: #B9C1CB; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .op { fill: none; stroke: #838C99; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .encl { fill: none; stroke: #B45A22; stroke-width: 1.75; stroke-dasharray: 7 4; }
      .line { stroke: #838C99; stroke-width: 1.5; fill: none; }
      .cutline { stroke: #B45A22; stroke-width: 1.75; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/>

  <!-- vision branch, deleted -->
  <rect class="encl" x="92" y="52" width="560" height="126" rx="4"/>
  <text class="cutlab" x="92" y="42">model.vision_tower.*  +  model.embed_vision.*  —  356 tensors  ·  575,743,536 params  ·  1.15 GB bf16  —  DELETE</text>

  <rect class="io" x="16" y="88" width="62" height="54" rx="3"/>
  <text class="t" x="47" y="110" text-anchor="middle">image</text>
  <text class="n" x="47" y="126" text-anchor="middle">896²</text>
  <line class="line" x1="78" y1="115" x2="102" y2="115" marker-end="url(#ah)"/>

  <rect class="cut" x="104" y="88" width="118" height="54" rx="3"/>
  <text class="t" x="163" y="108" text-anchor="middle">patch_embedder</text>
  <text class="s" x="163" y="123" text-anchor="middle">patch 16</text>
  <text class="n" x="163" y="136" text-anchor="middle">24,477,696</text>
  <line class="line" x1="222" y1="115" x2="240" y2="115" marker-end="url(#ah)"/>

  <rect class="cut" x="242" y="88" width="146" height="54" rx="3"/>
  <text class="t" x="315" y="108" text-anchor="middle">27 × SigLIP block</text>
  <text class="s" x="315" y="123" text-anchor="middle">1152d · 16 heads</text>
  <text class="n" x="315" y="136" text-anchor="middle">545,070,384</text>
  <line class="line" x1="388" y1="115" x2="406" y2="115" marker-end="url(#ah)"/>

  <rect class="cut" x="408" y="88" width="130" height="54" rx="3"/>
  <text class="t" x="473" y="108" text-anchor="middle">embed_vision</text>
  <text class="s" x="473" y="123" text-anchor="middle">→ 5376d</text>
  <text class="n" x="473" y="136" text-anchor="middle">6,193,152</text>
  <line class="line" x1="538" y1="115" x2="556" y2="115" marker-end="url(#ah)"/>

  <rect class="cut" x="558" y="88" width="86" height="54" rx="3"/>
  <text class="t" x="601" y="108" text-anchor="middle">std norm</text>
  <text class="s" x="601" y="123" text-anchor="middle">scale + bias</text>
  <text class="n" x="601" y="136" text-anchor="middle">2,304</text>

  <!-- the single edge into the text spine -->
  <path class="cutline" d="M 601 178 L 601 300" marker-end="url(#ahc)"/>
  <text class="cutlab" x="612" y="230">image soft tokens</text>
  <text class="n" x="612" y="245" fill="#B45A22">280 per image · 5376d</text>

  <!-- text spine -->
  <rect class="io" x="16" y="306" width="62" height="54" rx="3"/>
  <text class="t" x="47" y="328" text-anchor="middle">text</text>
  <text class="n" x="47" y="344" text-anchor="middle">token ids</text>
  <line class="line" x1="78" y1="333" x2="102" y2="333" marker-end="url(#ah)"/>

  <rect class="keep" x="104" y="306" width="140" height="54" rx="3"/>
  <text class="t" x="174" y="326" text-anchor="middle">embed_tokens</text>
  <text class="s" x="174" y="341" text-anchor="middle">262144 × 5376 · tied</text>
  <text class="n" x="174" y="354" text-anchor="middle">1,409,286,144</text>
  <line class="line" x1="244" y1="333" x2="540" y2="333" marker-end="url(#ah)"/>
  <text class="lab" x="392" y="327" text-anchor="middle">text embeddings bypass the vision branch entirely</text>

  <rect class="op" x="542" y="306" width="118" height="54" rx="3"/>
  <text class="t" x="601" y="330" text-anchor="middle">scatter</text>
  <text class="n" x="601" y="346" text-anchor="middle">at image tokens</text>
  <line class="line" x1="660" y1="333" x2="686" y2="333" marker-end="url(#ah)"/>

  <!-- decoder, split by what happened to each half -->
  <rect class="box" x="688" y="288" width="180" height="90" rx="3"/>
  <text class="t" x="778" y="306" text-anchor="middle">60 × decoder</text>
  <text class="n" x="778" y="319" text-anchor="middle">5376d · 5 sliding : 1 global</text>

  <rect class="fp8" x="698" y="326" width="80" height="42" rx="3"/>
  <text class="s" x="738" y="341" text-anchor="middle" fill="#2E7D5B">self_attn</text>
  <text class="n" x="738" y="353" text-anchor="middle" fill="#2E7D5B">230 proj</text>
  <text class="n" x="738" y="364" text-anchor="middle" fill="#2E7D5B">→ FP8</text>

  <rect class="nvfp4" x="782" y="326" width="76" height="42" rx="3"/>
  <text class="s" x="820" y="341" text-anchor="middle" fill="#5B4B9E">mlp</text>
  <text class="n" x="820" y="353" text-anchor="middle" fill="#5B4B9E">180 tensors</text>
  <text class="n" x="820" y="364" text-anchor="middle" fill="#5B4B9E">NVFP4</text>

  <line class="line" x1="868" y1="333" x2="886" y2="333" marker-end="url(#ah)"/>

  <rect class="keep" x="888" y="306" width="118" height="54" rx="3"/>
  <text class="t" x="947" y="326" text-anchor="middle">norm + lm_head</text>
  <text class="s" x="947" y="341" text-anchor="middle">tied to embeddings</text>
  <text class="n" x="947" y="354" text-anchor="middle">shared</text>
  <line class="line" x1="1006" y1="333" x2="1024" y2="333" marker-end="url(#ah)"/>

  <rect class="io" x="1026" y="306" width="46" height="54" rx="3"/>
  <text class="t" x="1049" y="336" text-anchor="middle">logits</text>

  <!-- result bracket -->
  <path class="line" d="M 104 396 L 104 404 L 1006 404 L 1006 396" stroke="#12586F"/>
  <text class="keeplab" x="555" y="424" text-anchor="middle">RESULT — 23.00 GB on disk · was 32.63 GB · 29.5% smaller</text>
  <text class="lab" x="555" y="442" text-anchor="middle">MLP weights byte-identical to NVIDIA's · attention verified bit-identical before requantizing</text>
</svg>
