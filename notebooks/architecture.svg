<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430" role="img" aria-label="GLM-4.6V-Flash forward path. An upper vision branch runs image, patch embed, position embedding, 24 ViT blocks, downsample and merger, all enclosed in a dashed delete boundary labelled model.visual.*, 892,498,432 parameters. Its only output is a single arrow of image soft tokens descending into a masked scatter fusion point on the lower text spine. The text spine runs text tokens, embed tokens, fusion, 40 decoder layers, norm and lm head, to logits, and is entirely retained.">
